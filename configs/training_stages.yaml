# Multi-stage contrastive training configuration
# All durations are wall-clock minutes

base_model: "answerdotai/ModernBERT-base"
# embedding_dim is determined by the base model (768 for base, 1024 for large)
projection_dim: 768
pooling: "cls"  # mean, cls, cls_mean, latent_attn, layer_weighted
max_seq_length: 256  # 512 causes NaN — revert to exp-67 working value until debugged
normalize_embeddings: true

stages:
  warmup:
    duration_minutes: 15
    data: "qqp_se_paraphrase"
    loss: "infonce"
    temperature: 0.1
    learning_rate: 1.0e-4
    lr_schedule: "linear_warmup_constant"
    warmup_ratio: 0.1
    batch_size: 64  # match exp-67 working config
    negatives: "in_batch_only"
    freeze_encoder_layers: 0  # freeze first N layers
    false_neg_threshold: 0.0  # disabled for warmup (paraphrase data is clean)

  contrastive:
    duration_minutes: 60
    data: "all_curated"
    loss: "infonce"
    temperature: 0.05
    learning_rate: 5.0e-5
    lr_schedule: "cosine_decay"
    warmup_ratio: 0.05
    batch_size: 16  # small batch + grad_accum=4 → effective batch 64
    negatives: "in_batch_plus_explicit"
    source_stratification: true  # fill batches from single source
    false_neg_threshold: 0.7  # mask in-batch negatives with cosine sim > 0.7

  hard_neg_mining:
    duration_minutes: 5
    top_k: 7
    batch_size: 128  # inference only, can be larger
    min_similarity: 0.3  # ignore very dissimilar passages

  fine_tuning:
    duration_minutes: 5
    data: "all_curated_with_hard_negs"
    loss: "infonce"
    temperature: 0.05
    learning_rate: 1.0e-5
    lr_schedule: "cosine_decay"
    warmup_ratio: 0.0
    batch_size: 16  # small batch + grad_accum=4 → effective batch 64
    hard_neg_weight: 0.0  # DISABLED — hard neg loss needs investigation (exp-70: weight=2.0 scored 37.77)
    false_neg_threshold: 0.0  # disabled for FT (hard negs are intentionally hard)

optimizer:
  type: "adamw"
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.01
  llrd_decay: 1.0  # DISABLED — causes NaN (tested 3x). DO NOT re-enable until implementation is verified.
  ema_decay: 0.0  # DISABLED — causes NaN (tested 3x). DO NOT re-enable until implementation is verified.

data:
  max_rows_per_dataset: 50000  # up from 30K default — more data, more diverse negatives

memory:
  max_peak_gb: 55
  gradient_accumulation_steps: 1  # disable grad_accum — batch_size=64 with seq_len=256 fits in memory
  gradient_checkpointing: false  # DISABLED: nn_checkpoint causes NaN loss (exp-72). Needs investigation.
