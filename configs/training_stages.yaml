# Multi-stage contrastive training configuration
# All durations are wall-clock minutes

base_model: "answerdotai/ModernBERT-base"
# embedding_dim is determined by the base model (768 for base, 1024 for large)
projection_dim: 768
pooling: "cls"  # exp-109: mean pooling was flat/-0.42 on 21-task eval; CLS is our baseline
max_seq_length: 256  # revert to working value; seq_len=512 regressed in exp-74
normalize_embeddings: true
simclr_head: false  # exp-77: SimCLR head regressed (52.88 vs 57.51)

stages:
  warmup:
    duration_minutes: 15  # revert: exp-115 showed 30min warmup over-specialized on paraphrase data (-4.88 primary, reranking -25.10)
    data: "qqp_se_paraphrase"
    loss: "infonce"
    temperature: 0.1
    learning_rate: 1.0e-4
    lr_schedule: "linear_warmup_constant"
    warmup_ratio: 0.1
    batch_size: 64  # try B=64 at seq_len=512; if OOM, fall back to 32+grad_accum
    negatives: "in_batch_only"
    freeze_encoder_layers: 0  # freeze first N layers
    false_neg_threshold: 0.0  # disabled for warmup (paraphrase data is clean)

  contrastive:
    duration_minutes: 240  # exp-128 best recipe: 240min+200K+temp=0.03+LR=3e-5 = 63.53
    data: "all_curated"
    loss: "infonce"
    temperature: 0.03  # exp-128 recipe; temp=0.03+LR=3e-5 is genuinely superior to temp=0.05+LR=5e-5 (63.53 vs ~58)
    temperature_end: 0.0  # disabled (exp-104: 0.07→0.03 annealing was essentially flat)
    learning_rate: 3.0e-5  # exp-128 recipe; LR=3e-5 pairs with temp=0.03
    lr_schedule: "cosine_decay"
    warmup_ratio: 0.05
    batch_size: 64  # revert: B=96 is 8x slower per step (29s vs 3.6s); likely Metal memory thrashing; B=64 gives 3000 steps/180min
    negatives: "in_batch_plus_explicit"
    source_stratification: false  # exp-136 showed strat=true hurts at temp=0.05 too (-0.69); exp-107 never used strat (dead code); exp-129 showed -0.59 at temp=0.03
    symmetric: true  # restored: B=64 + symmetric is the proven exp-111/117 baseline
    false_neg_threshold: 0.0  # revert: exp-120 regressed -2.21 (60.13 vs 62.34) with threshold=0.8, though confounded by GPU contention

  hard_neg_mining:
    duration_minutes: 5
    top_k: 7
    batch_size: 128
    min_similarity: 0.3

  fine_tuning:
    duration_minutes: 5  # revert: exp-124 showed 15min FT was 99% saturated from step 50 — only +0.07 primary (62.67 vs 62.60); 5min is enough for 8K mined hard negs
    data: "all_curated_with_hard_negs"
    loss: "infonce"
    temperature: 0.05  # revert: exp-114 showed FT temp=0.03 improved STS +2.29 but hurt retrieval -3.41; 0.05 is better overall
    learning_rate: 1.0e-5
    lr_schedule: "cosine_decay"
    warmup_ratio: 0.0
    batch_size: 64
    hard_neg_weight: 0.0  # exp-130: weight=0.5 caused catastrophic forgetting (-4.63 primary, PairClass -12.47); exp-102: weight=1.0 also regressed -3.19; hard negs in FT are toxic at any weight — the FT stage is effectively just continuation of contrastive at different hyperparams
    false_neg_threshold: 0.0

optimizer:
  type: "adamw"
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.01  # revert: exp-133 showed 0.03 regressed -4.96 (58.57 vs 63.53); PairClass collapsed (SprintDup -18.86); 0.01 is optimal
  llrd_decay: 1.0  # disabled: LLRD catastrophic at ANY decay — exp-92 (0.95)=39.21, exp-134 (0.99)=48.16; contrastive learning needs full gradient at all layers
  ema_decay: 0.0  # disabled: exp-122/124 showed EMA improves clustering +4-6 but regresses PairClass -2 to -3; testing LR=3e-5 alone to see if lower LR is the actual driver

data:
  max_rows_per_dataset: 200000  # exp-128 recipe: 200K+temp=0.03+LR=3e-5+240min = 63.53 (best)
  cross_dedup: false  # exp-137: dedup removed 48K pairs (3.2%) but primary collapsed to 54.0 (-9.5); testing without dedup to isolate code drift vs dedup effect

memory:
  max_peak_gb: 55
  gradient_accumulation_steps: 1  # exp-67 config said 4 but code had no grad_accum implementation — actual was 1
  gradient_checkpointing: false  # disabled to match exp-67 baseline exactly
