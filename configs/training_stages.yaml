# Multi-stage contrastive training configuration
# All durations are wall-clock minutes

base_model: "answerdotai/ModernBERT-base"
# embedding_dim is determined by the base model (768 for base, 1024 for large)
projection_dim: 768
pooling: "cls"  # mean, cls, cls_mean, latent_attn, layer_weighted
max_seq_length: 512  # NaN fix: -inf → -1e9 in attention masks (padding+sliding window created all-inf rows)
normalize_embeddings: true

stages:
  warmup:
    duration_minutes: 15
    data: "qqp_se_paraphrase"
    loss: "infonce"
    temperature: 0.1
    learning_rate: 1.0e-4
    lr_schedule: "linear_warmup_constant"
    warmup_ratio: 0.1
    batch_size: 64  # try B=64 at seq_len=512; if OOM, fall back to 32+grad_accum
    negatives: "in_batch_only"
    freeze_encoder_layers: 0  # freeze first N layers
    false_neg_threshold: 0.0  # disabled for warmup (paraphrase data is clean)

  contrastive:
    duration_minutes: 60
    data: "all_curated"
    loss: "infonce"
    temperature: 0.05
    learning_rate: 5.0e-5
    lr_schedule: "cosine_decay"
    warmup_ratio: 0.05
    batch_size: 64  # try B=64 at seq_len=512 (in-batch negatives matter)
    negatives: "in_batch_plus_explicit"
    source_stratification: true  # fill batches from single source
    false_neg_threshold: 0.0  # disabled to match exp-67 baseline (isolate seq_len effect)

  hard_neg_mining:
    duration_minutes: 5
    top_k: 7
    batch_size: 128  # inference only, can be larger
    min_similarity: 0.3  # ignore very dissimilar passages

  fine_tuning:
    duration_minutes: 5
    data: "all_curated_with_hard_negs"
    loss: "infonce"
    temperature: 0.05
    learning_rate: 1.0e-5
    lr_schedule: "cosine_decay"
    warmup_ratio: 0.0
    batch_size: 64  # try B=64 at seq_len=512
    hard_neg_weight: 0.0  # DISABLED — hard neg loss needs investigation (exp-70: weight=2.0 scored 37.77)
    false_neg_threshold: 0.0  # disabled for FT (hard negs are intentionally hard)

optimizer:
  type: "adamw"
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.01
  llrd_decay: 1.0  # DISABLED — NaN was from attention masks not LLRD, but has weight_decay asymmetry bug. Fix before re-enabling.
  ema_decay: 0.0  # DISABLED — NaN was from attention masks not EMA, but needs mx.eval every step not every 100. Fix before re-enabling.

data:
  max_rows_per_dataset: 30000  # revert to exp-67 baseline to isolate seq_len=512 effect

memory:
  max_peak_gb: 55
  gradient_accumulation_steps: 1  # no grad_accum — trying B=64 at seq_len=512 directly
  gradient_checkpointing: true  # RE-ENABLED: NaN was from -inf attention masks, not grad_ckpt. Saves ~80% activation memory.
