# Multi-stage contrastive training configuration
# All durations are wall-clock minutes

base_model: "answerdotai/ModernBERT-base"
# embedding_dim is determined by the base model (768 for base, 1024 for large)
projection_dim: 768
pooling: "cls"  # exp-109: mean pooling was flat/-0.42 on 21-task eval; CLS is our baseline
max_seq_length: 256  # revert to working value; seq_len=512 regressed in exp-74
normalize_embeddings: true
simclr_head: false  # exp-77: SimCLR head regressed (52.88 vs 57.51)

stages:
  warmup:
    duration_minutes: 15
    data: "qqp_se_paraphrase"
    loss: "infonce"
    temperature: 0.1
    learning_rate: 1.0e-4
    lr_schedule: "linear_warmup_constant"
    warmup_ratio: 0.1
    batch_size: 64  # try B=64 at seq_len=512; if OOM, fall back to 32+grad_accum
    negatives: "in_batch_only"
    freeze_encoder_layers: 0  # freeze first N layers
    false_neg_threshold: 0.0  # disabled for warmup (paraphrase data is clean)

  contrastive:
    duration_minutes: 180  # exp-107 baseline (best on non-retrieval categories)
    data: "all_curated"
    loss: "infonce"
    temperature: 0.03  # exp-111 sweet spot: 0.03 beat 0.05 (+3.53 retrieval) and 0.02 regressed (-1.33 retrieval in exp-112)
    temperature_end: 0.0  # disabled (exp-104: 0.07→0.03 annealing was essentially flat)
    learning_rate: 5.0e-5  # exp-91 baseline (LR increases regressed in exp-93, exp-94)
    lr_schedule: "cosine_decay"
    warmup_ratio: 0.05
    batch_size: 64  # exp-91 baseline (batch=128 OOM, batch=96 regressed)
    negatives: "in_batch_plus_explicit"
    source_stratification: true
    symmetric: true  # exp-103: bidirectional InfoNCE (query→pos + pos→query); doubles gradient signal; standard in SimCSE, E5
    false_neg_threshold: 0.0

  hard_neg_mining:
    duration_minutes: 5
    top_k: 7
    batch_size: 128
    min_similarity: 0.3

  fine_tuning:
    duration_minutes: 5  # exp-108 proved fine-tuning is necessary (removing it regressed SprintDup -15.26, TwitterURL -9.07)
    data: "all_curated_with_hard_negs"
    loss: "infonce"
    temperature: 0.05
    learning_rate: 1.0e-5
    lr_schedule: "cosine_decay"
    warmup_ratio: 0.0
    batch_size: 64
    hard_neg_weight: 0.0  # revert: exp-102 showed weight=1.0 causes catastrophic forgetting (-3.19 primary)
    false_neg_threshold: 0.0

optimizer:
  type: "adamw"
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.01
  llrd_decay: 1.0  # disabled (exp-92: 0.95 caused catastrophic underfitting, 39.21 primary)
  ema_decay: 0.0  # DISABLED — NaN was from attention masks not EMA, but needs mx.eval every step not every 100. Fix before re-enabling.

data:
  max_rows_per_dataset: 100000  # revert to exp-104 baseline (200K caused STS/PairClass regression in exp-105/106 via signal dilution)

memory:
  max_peak_gb: 55
  gradient_accumulation_steps: 1  # exp-67 config said 4 but code had no grad_accum implementation — actual was 1
  gradient_checkpointing: false  # disabled to match exp-67 baseline exactly
